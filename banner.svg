<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Grass gradient: lighter at top (far), darker at bottom (near) -->
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a9e54"/>
      <stop offset="50%" stop-color="#2d8447"/>
      <stop offset="100%" stop-color="#1f6b37"/>
    </linearGradient>

    <!-- Pitch clip (trapezoidal perspective) -->
    <clipPath id="pitchClip">
      <polygon points="60,60 740,60 800,450 0,450"/>
    </clipPath>

    <!-- Spotlight glow from top center -->
    <radialGradient id="spotGlow" cx="50%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base pitch -->
  <rect x="0" y="0" width="800" height="450" fill="url(#grassGrad)"/>

  <g clip-path="url(#pitchClip)">
    <!-- Grass mowing stripes (alternating light/dark green, top to bottom) -->
    <!-- Stripe 1: far end (light) -->
    <polygon points="60,60 740,60 780,120 20,120" fill="#3aae5a"/>
    <!-- Stripe 2 (dark) -->
    <polygon points="20,120 780,120 800,180 0,180" fill="#2d8447"/>
    <!-- Stripe 3 (light) -->
    <polygon points="0,180 800,180 820,240 -20,240" fill="#3aae5a"/>
    <!-- Stripe 4 (dark) -->
    <polygon points="-20,240 820,240 840,300 -40,300" fill="#2d8447"/>
    <!-- Stripe 5 (light) -->
    <polygon points="-40,300 840,300 860,360 -60,360" fill="#3aae5a"/>
    <!-- Stripe 6 (dark) -->
    <polygon points="-60,360 860,360 880,450 -80,450" fill="#2d8447"/>

    <!-- Spotlight glow overlay -->
    <rect x="0" y="0" width="800" height="450" fill="url(#spotGlow)"/>

    <!-- Field markings (white with slight transparency for perspective depth) -->
    <!-- Boundary lines - slightly inset from clip edge -->
    <polygon points="65,65 735,65 800,450 0,450" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>

    <!-- Halfway line -->
    <line x1="400" y1="65" x2="400" y2="450" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

    <!-- Center circle (perspective: ellipse) -->
    <ellipse cx="400" cy="258" rx="90" ry="40" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

    <!-- Center spot -->
    <circle cx="400" cy="258" r="3" fill="#ffffff"/>

    <!-- Left penalty area -->
    <polyline points="65,130 190,130 190,385 65,450" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

    <!-- Right penalty area -->
    <polyline points="735,130 610,130 610,385 735,450" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

    <!-- Left goal area (6-yard box) -->
    <polyline points="65,190 120,190 120,325 65,385" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

    <!-- Right goal area (6-yard box) -->
    <polyline points="735,190 680,190 680,325 735,385" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

    <!-- Penalty spots -->
    <circle cx="210" cy="258" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="590" cy="258" r="2.5" fill="#ffffff" opacity="0.8"/>

    <!-- Penalty arcs (dashed arc from penalty spot curving outward) -->
    <path d="M 210,218 A 60,60 0 0,1 210,298" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <path d="M 590,218 A 60,60 0 0,1 590,298" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

    <!-- Corner arcs (at the four corners of the pitch) -->
    <path d="M 70,68 Q 62,75 55,82" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <path d="M 730,68 Q 738,75 745,82" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

    <!-- Center circle arc (small dots at intersection with halfway line) -->
    <circle cx="310" cy="258" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="490" cy="258" r="2" fill="#ffffff" opacity="0.5"/>

    <!-- Penalty arcs extending beyond penalty area -->
    <path d="M 190,310 A 70,70 0 0,0 190,206" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <path d="M 610,310 A 70,70 0 0,0 610,206" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

    <!-- Goal posts (small rectangles at each end) -->
    <rect x="63" y="240" width="4" height="36" fill="#ffffff" opacity="0.8" rx="1"/>
    <rect x="733" y="240" width="4" height="36" fill="#ffffff" opacity="0.8" rx="1"/>

    <!-- Corner flags (small dots at corners) -->
    <circle cx="65" cy="65" r="3" fill="#ffffff"/>
    <circle cx="735" cy="65" r="3" fill="#ffffff"/>
  </g>

  <!-- ====== TEXT OVERLAY via foreignObject with CSS3 ====== -->
  <foreignObject width="800" height="450">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;">
      <style>
        @keyframes titlePulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.8; }
        }
        .container {
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
        }
        h1 {
          font-family: Arial Black, Impact, 'Trebuchet MS', sans-serif;
          font-size: 52px;
          color: #ffffff;
          text-shadow: 2px 2px 10px rgba(0,0,0,0.5), 0 0 20px rgba(0,0,0,0.3);
          margin: 0;
          letter-spacing: 4px;
          animation: titlePulse 4s ease-in-out infinite;
        }
        p {
          font-family: Georgia, 'Times New Roman', serif;
          font-size: 16px;
          color: #e8f0e5;
          text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
          margin: 8px 0 0 0;
          letter-spacing: 3px;
        }
      </style>
      <div class="container">
        <h1>RECREATIONAL SOCCER</h1>
        <p>COACHING PLANS · WEEKLY PRACTICES</p>
      </div>
    </div>
  </foreignObject>
</svg>
