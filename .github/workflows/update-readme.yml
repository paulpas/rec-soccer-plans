name: Update README

on:
  push:
    branches: [main]
    paths: ["*.html"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Belt-and-suspenders: skip if this commit was made by the workflow itself
    if: >
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update README tables
        run: node scripts/update-readme.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git add README.md
            git commit -m "Auto-update lesson plan tables [ci skip]"
            git push
          else
            echo "README up-to-date, no changes to commit."
          fi
