name: Update README

on:
  push:
    branches: [main]
    paths: ["*.html"]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Belt-and-suspenders: skip if this commit was made by the workflow itself
    if: >
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate README
        run: |
          set -euo pipefail

          REPO_URL="https://github.com/paulpas/rec-soccer-plans"

          # ── Write README header (HTML-styled) ──
          echo "# Rec Soccer Coaching Plans" > README.md
          echo "" >> README.md
          echo '<em>*Weekly practice plans with interactive checklists and auto-saved notes.*</em>' >> README.md
          echo "" >> README.md
          echo "<hr>" >> README.md
          echo "" >> README.md
          echo '<blockquote style="border-left:3px solid #E3A72E;padding-left:12px;color:#4B5C51;">Season plans for rec soccer coaching. Each plan includes structured drills, SVG field diagrams, and a checklist that auto-saves.</blockquote>' >> README.md
          echo "" >> README.md
          echo "## <small>Lesson Plans</small>" >> README.md
          echo '<small style="color:#4B5C51;">Click any plan to open the interactive lesson planner.</small>' >> README.md
          echo "" >> README.md
          echo "<hr>" >> README.md
          echo "" >> README.md
          echo "| Week | Day | Plan |" >> README.md
          echo "|------|-----|------|" >> README.md

          # ── Collect plan entries and write table rows to temp file ──
          FOUND=0
          rm -f /tmp/plan_rows.txt

          for file in week*_lesson_plan_enhanced.html; do
            [ -f "$file" ] || continue
            FOUND=1

            # Extract week number from filename (week<N>_... -> <N>)
            WEEK_NUM=$(echo "$file" | sed -n 's/^week\([0-9]*\)_.*/\1/p')
            [ -z "$WEEK_NUM" ] && continue

            # Determine day: "_wed" in filename → Wednesday, else → Monday
            if echo "$file" | grep -q '_wed_'; then
              DAY="Wednesday"
              DAY_IDX=1
            else
              DAY="Monday"
              DAY_IDX=0
            fi

            # Extract h1 title (may span lines), decode common HTML entities
            TITLE=$(grep -oPz '(?s)<h1>.*?</h1>' "$file" \
              | tr '\n' ' ' \
              | sed -n 's/.*<h1>\(.*\)<\/h1>.*/\1/p' \
              | sed 's/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g; s/&quot;/"/g; s/&#39;/'"'"'/g; s/&middot;/·/g')
            [ -z "$TITLE" ] && TITLE="Week ${WEEK_NUM} Plan"

            PREVIEW_URL="${REPO_URL}/blob/main/${file}"
            # Sort key: week number padded + day index for correct ordering
            SORT_KEY=$(printf '%03d%d' "$WEEK_NUM" "$DAY_IDX")
            echo "${SORT_KEY}|${WEEK_NUM}|${DAY}|${TITLE}|${file}|${PREVIEW_URL}" \
              >> /tmp/plan_rows.txt
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "0000|—||*No plans yet*||" >> /tmp/plan_rows.txt
          fi

          # Sort by week+day key, then emit formatted table rows with day badges
          sort -t'|' -k1 -n /tmp/plan_rows.txt | while IFS='|' read -r _sort week day title file preview_url; do
            case "$day" in
              Wednesday) DAY_BADGE='<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background-color:#E3A72E;color:#152018;">Wednesday</span>' ;;
              *)         DAY_BADGE='<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background-color:#1F4D36;color:#F7F5EC;">'"${day}"'</span>' ;;
            esac
            ESCAPED_TITLE=$(echo "$title" | sed 's/&/\&amp;/g')
            echo "| ${week} | ${DAY_BADGE} | [${ESCAPED_TITLE}](https://html-preview.github.io/?url=${preview_url}) |"
          done >> README.md

          # ── Footer note ──
          echo "" >> README.md
          echo "<hr>" >> README.md
          echo '<p style="font-size:0.85em;color:#4B5C51;">Plans are auto-generated from HTML files in this repository.</p>' >> README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "README.md is already up to date — nothing to commit."
            exit 0
          fi

          git add README.md
          git commit -m "chore: auto-update README with lesson plan links [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
