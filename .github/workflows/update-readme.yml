name: Update README

on:
  push:
    branches: [main]
    paths: ["*.html"]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Belt-and-suspenders: skip if this commit was made by the workflow itself
    if: >
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate README
        run: |
          set -euo pipefail

          REPO_URL="https://github.com/paulpas/rec-soccer-plans"

          cat > README.md << 'EOF'
