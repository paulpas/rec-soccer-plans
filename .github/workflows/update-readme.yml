name: Update README

on:
  push:
    branches: [main]
    paths: ["*.html"]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Belt-and-suspenders: skip if this commit was made by the workflow itself
    if: >
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate README
        run: |
          set -euo pipefail

          REPO_URL="https://github.com/paulpas/rec-soccer-plans"

          cat > README.md << 'EOF'
# Rec Soccer Coaching Plans

<em>*Weekly practice plans with interactive checklists and auto-saved notes.*</em>

<div style="text-align:center;margin:20px 0;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="700" height="180" style="max-width:100%;height:auto;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.15);">
  <rect x="5" y="5" width="690" height="170" rx="4" fill="#1F4D36" stroke="#F7F5EC" stroke-width="2"/>
  <line x1="350" y1="5" x2="350" y2="175" stroke="#F7F5EC" stroke-width="2"/>
  <circle cx="350" cy="90" r="40" fill="none" stroke="#F7F5EC" stroke-width="2"/>
  <circle cx="350" cy="90" r="3" fill="#F7F5EC"/>
  <rect x="5" y="40" width="110" height="100" fill="none" stroke="#F7F5EC" stroke-width="2"/>
  <rect x="585" y="40" width="110" height="100" fill="none" stroke="#F7F5EC" stroke-width="2"/>
  <rect x="5" y="65" width="40" height="50" fill="none" stroke="#F7F5EC" stroke-width="1.5"/>
  <rect x="655" y="65" width="40" height="50" fill="none" stroke="#F7F5EC" stroke-width="1.5"/>
  <circle cx="90" cy="90" r="2.5" fill="#F7F5EC"/>
  <circle cx="610" cy="90" r="2.5" fill="#F7F5EC"/>
</svg>
</div>

<div style="height:4px;margin:16px 0;border-radius:2px;background:repeating-linear-gradient(90deg,#1F4D36 0px,#1F4D36 40px,#173622 40px,#173622 80px);"></div>

<p style="margin:8px 0;"><span style="font-size:24px;">⚽</span> Season plans for rec soccer coaching. Each plan includes structured drills, SVG field diagrams, and a checklist that auto-saves.</p>

<h2 style="margin-top:20px;">🥅 Lesson Plans</h2>
<small style="color:#4B5C51;">Click any plan to open the interactive lesson planner.</small>

<div style="border:2px solid #1F4D36;border-radius:8px;overflow:hidden;margin:12px 0;">
EOF

          # ── Collect plan entries and write table rows to temp file ──
          FOUND=0
          rm -f /tmp/plan_rows.txt

          for file in week*_lesson_plan_enhanced.html; do
            [ -f "$file" ] || continue
            FOUND=1

            # Extract week number from filename (week<N>_... -> <N>)
            WEEK_NUM=$(echo "$file" | sed -n 's/^week\([0-9]*\)_.*/\1/p')
            [ -z "$WEEK_NUM" ] && continue

            # Determine day: "_wed" in filename → Wednesday, else → Monday
            if echo "$file" | grep -q '_wed_'; then
              DAY="Wednesday"
              DAY_IDX=1
            else
              DAY="Monday"
              DAY_IDX=0
            fi

            # Extract h1 title (may span lines), decode common HTML entities
            TITLE=$(grep -oPz '(?s)<h1>.*?</h1>' "$file" \
              | tr '\n' ' ' \
              | sed -n 's/.*<h1>\(.*\)<\/h1>.*/\1/p' \
              | sed 's/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g; s/&quot;/"/g; s/&#39;/'"'"'/g; s/&middot;/·/g')
            [ -z "$TITLE" ] && TITLE="Week ${WEEK_NUM} Plan"

            PREVIEW_URL="${REPO_URL}/blob/main/${file}"
            # Sort key: week number padded + day index for correct ordering
            SORT_KEY=$(printf '%03d%d' "$WEEK_NUM" "$DAY_IDX")
            echo "${SORT_KEY}|${WEEK_NUM}|${DAY}|${TITLE}|${file}|${PREVIEW_URL}" \
              >> /tmp/plan_rows.txt
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "0000|—||*No plans yet*||" >> /tmp/plan_rows.txt
          fi

          # Sort by week+day key, then emit formatted table rows with day badges
          sort -t'|' -k1 -n /tmp/plan_rows.txt | while IFS='|' read -r _sort week day title file preview_url; do
            if [ "$day" = "Wednesday" ]; then
              DAY_HTML='<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background-color:#E3A72E;color:#152018;">Wednesday</span>'
            else
              DAY_HTML='<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background-color:#1F4D36;color:#F7F5EC;">Monday</span>'
            fi
            ESCAPED_TITLE=$(echo "$title" | sed 's/&/\&amp;/g')
            echo "| ${week} | ${DAY_HTML} | [${ESCAPED_TITLE}](https://html-preview.github.io/?url=${preview_url}) |" >> README.md
          done

          cat >> README.md << 'FOOTER'
</div>

<div style="height:4px;margin:16px 0;border-radius:2px;background:repeating-linear-gradient(90deg,#1F4D36 0px,#1F4D36 40px,#173622 40px,#173622 80px);"></div>
<p style="font-size:0.85em;color:#4B5C51;margin:8px 0;">🏁 Plans are auto-generated from HTML files in this repository.</p>
FOOTER

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "README.md is already up to date — nothing to commit."
            exit 0
          fi

          git add README.md
          git commit -m "chore: auto-update README with lesson plan links [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
