name: Generate Lesson Plan Tables

on:
  push:
    paths:
      - '*.html'
      - 'scripts/generate-tables.mjs'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-tables:
    name: Auto-generate README tables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate tables and update README
        run: |
          node scripts/update-readme.mjs

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if ! git diff --quiet; then
            git add README.md
            git commit -m "Auto-update lesson plan tables [ci skip]"
            git push
          else
            echo "README up-to-date, no changes to commit."
          fi
