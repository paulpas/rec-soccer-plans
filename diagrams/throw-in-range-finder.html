<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Throw-In Range Finder — Drill Diagram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 960px;
      width: 100%;
    }
    h1 {
      text-align: center;
      font-size: 1.4em;
      color: #333;
      margin-bottom: 16px;
    }
    svg { width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Throw-In Range Finder — 3 Phases</h1>
    <svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
      <!-- ========== DEFS: Arrow markers ========== -->
      <defs>
        <marker id="arrowWhite" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L8,3 L0,6 Z" fill="white" fill-opacity="0.9" />
        </marker>
        <marker id="arrowSolid" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L8,3 L0,6 Z" fill="#333" />
        </marker>
        <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L8,3 L0,6 Z" fill="#FFD54F" />
        </marker>
        <!-- Filter for subtle card shadow -->
        <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
          <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
        </filter>
      </defs>

      <!-- ============================================================ -->
      <!-- PHASE 1 — Find Range                                         -->
      <!-- Card: x=10, y=20, w=270, h=340                               -->
      <!-- ============================================================ -->
      <g transform="translate(10, 20)">
        <!-- Card background -->
        <rect width="270" height="340" rx="10" ry="10" fill="white" filter="url(#cardShadow)" stroke="#e0e0e0" stroke-width="1"/>

        <!-- Title bar -->
        <rect width="270" height="42" rx="10" ry="10" fill="#333"/>
        <rect width="270" height="42" x="0" y="10" fill="#333"/>
        <text x="135" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="0.5">PHASE 1 — Find Range</text>

        <!-- Green field -->
        <rect x="12" y="52" width="246" height="220" rx="6" ry="6" fill="#4CAF50"/>
        <!-- Field lines (center line) -->
        <line x1="135" y1="52" x2="135" y2="272" stroke="white" stroke-width="1" stroke-opacity="0.25"/>
        <!-- Field border -->
        <rect x="12" y="52" width="246" height="220" rx="6" ry="6" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>

        <!-- Dashed arrow: A to B (throw) -->
        <line x1="80" y1="148" x2="190" y2="148" stroke="white" stroke-width="1.8" stroke-dasharray="6,4" stroke-opacity="0.9" marker-end="url(#arrowWhite)"/>
        <!-- Dashed arrow: B to A (return throw) -->
        <line x1="190" y1="168" x2="80" y2="168" stroke="white" stroke-width="1.8" stroke-dasharray="6,4" stroke-opacity="0.9" marker-end="url(#arrowWhite)"/>

        <!-- Cone marker between them -->
        <polygon points="135,165 129,180 141,180" fill="#FFD54F" stroke="#F9A825" stroke-width="1"/>
        <text x="135" y="192" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="white" font-weight="600" opacity="0.8">CONE</text>

        <!-- Player A -->
        <circle cx="55" cy="158" r="18" fill="#2196F3" stroke="white" stroke-width="2"/>
        <text x="55" y="163" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="white">A</text>

        <!-- Ball near A -->
        <circle cx="78" cy="138" r="6" fill="white" stroke="#333" stroke-width="1.2"/>

        <!-- Player B -->
        <circle cx="215" cy="158" r="18" fill="#FF9800" stroke="white" stroke-width="2"/>
        <text x="215" y="163" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="white">B</text>

        <!-- Distance label -->
        <text x="135" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="white" font-weight="600" opacity="0.8">10-12 yards</text>

        <!-- Sideline markers -->
        <text x="135" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="white" opacity="0.5">SIDELINE</text>

        <!-- Caption area -->
        <rect x="12" y="280" width="246" height="48" rx="6" ry="6" fill="#f8f8f8"/>
        <text x="135" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#555" font-weight="500">Throw back &amp; forth to find</text>
        <text x="135" y="314" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#555" font-weight="500">max distance. Mark with cone.</text>
      </g>

      <!-- ============================================================ -->
      <!-- PHASE 2 — Throw Into Movement                                -->
      <!-- Card: x=310, y=20, w=270, h=340                              -->
      <!-- ============================================================ -->
      <g transform="translate(315, 20)">
        <!-- Card background -->
        <rect width="270" height="340" rx="10" ry="10" fill="white" filter="url(#cardShadow)" stroke="#e0e0e0" stroke-width="1"/>

        <!-- Title bar -->
        <rect width="270" height="42" rx="10" ry="10" fill="#333"/>
        <rect width="270" height="42" x="0" y="10" fill="#333"/>
        <text x="135" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="0.5">PHASE 2 — Throw Into Movement</text>

        <!-- Green field -->
        <rect x="12" y="52" width="246" height="220" rx="6" ry="6" fill="#4CAF50"/>
        <!-- Field lines -->
        <line x1="135" y1="52" x2="135" y2="272" stroke="white" stroke-width="1" stroke-opacity="0.25"/>
        <rect x="12" y="52" width="246" height="220" rx="6" ry="6" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>

        <!-- Range zone (shaded area showing throwing range) -->
        <rect x="12" y="130" width="148" height="70" rx="4" ry="4" fill="white" fill-opacity="0.08"/>
        <text x="86" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" fill="white" opacity="0.4" font-weight="600">THROW RANGE</text>

        <!-- Solid arrow: B sprinting LEFT into range -->
        <line x1="200" y1="205" x2="110" y2="205" stroke="#FFD54F" stroke-width="2.2" stroke-opacity="0.95" marker-end="url(#arrowGreen)"/>
        <text x="155" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="#FFD54F" font-weight="600">B sprints in</text>

        <!-- Dashed arrow: A throws to B (to the moving target) -->
        <line x1="75" y1="155" x2="175" y2="155" stroke="white" stroke-width="1.8" stroke-dasharray="6,4" stroke-opacity="0.9" marker-end="url(#arrowWhite)"/>

        <!-- Cone marker -->
        <polygon points="155,160 149,175 161,175" fill="#FFD54F" stroke="#F9A825" stroke-width="1"/>
        <text x="155" y="187" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="white" font-weight="600" opacity="0.8">CONE</text>

        <!-- Player A (thrower, near sideline) -->
        <circle cx="45" cy="160" r="18" fill="#2196F3" stroke="white" stroke-width="2"/>
        <text x="45" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="white">A</text>

        <!-- Ball near A -->
        <circle cx="68" cy="142" r="6" fill="white" stroke="#333" stroke-width="1.2"/>

        <!-- Player B starting position (ghost / faded) -->
        <circle cx="200" cy="160" r="18" fill="#FF9800" stroke="white" stroke-width="2" fill-opacity="0.4" stroke-opacity="0.5"/>
        <text x="200" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="white" opacity="0.5">B</text>
        <text x="200" y="143" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" fill="white" opacity="0.5">(start)</text>

        <!-- Player B end position (solid, where B ends up after sprint) -->
        <circle cx="110" cy="160" r="18" fill="#FF9800" stroke="white" stroke-width="2"/>
        <text x="110" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="white">B</text>

        <!-- Sideline marker -->
        <text x="22" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="white" opacity="0.5">SIDELINE</text>

        <!-- Caption area -->
        <rect x="12" y="280" width="246" height="48" rx="6" ry="6" fill="#f8f8f8"/>
        <text x="135" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#555" font-weight="500">Receiver sprints INTO range</text>
        <text x="135" y="314" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#555" font-weight="500">before the throw. Create space!</text>
      </g>

      <!-- ============================================================ -->
      <!-- PHASE 3 — Receive, Turn & Shoot                             -->
      <!-- Card: x=610, y=20, w=270, h=340                              -->
      <!-- ============================================================ -->
      <g transform="translate(620, 20)">
        <!-- Card background -->
        <rect width="270" height="340" rx="10" ry="10" fill="white" filter="url(#cardShadow)" stroke="#e0e0e0" stroke-width="1"/>

        <!-- Title bar -->
        <rect width="270" height="42" rx="10" ry="10" fill="#333"/>
        <rect width="270" height="42" x="0" y="10" fill="#333"/>
        <text x="135" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="0.5">PHASE 3 — Receive, Turn &amp; Shoot</text>

        <!-- Green field -->
        <rect x="12" y="52" width="246" height="220" rx="6" ry="6" fill="#4CAF50"/>
        <!-- Field lines -->
        <line x1="135" y1="52" x2="135" y2="272" stroke="white" stroke-width="1" stroke-opacity="0.25"/>
        <rect x="12" y="52" width="246" height="220" rx="6" ry="6" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>

        <!-- Goal icon at right edge -->
        <rect x="240" y="120" width="16" height="60" rx="2" ry="2" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.8"/>
        <!-- Goal net lines -->
        <line x1="240" y1="130" x2="256" y2="130" stroke="white" stroke-width="0.7" stroke-opacity="0.3"/>
        <line x1="240" y1="140" x2="256" y2="140" stroke="white" stroke-width="0.7" stroke-opacity="0.3"/>
        <line x1="240" y1="150" x2="256" y2="150" stroke="white" stroke-width="0.7" stroke-opacity="0.3"/>
        <line x1="240" y1="160" x2="256" y2="160" stroke="white" stroke-width="0.7" stroke-opacity="0.3"/>
        <line x1="240" y1="170" x2="256" y2="170" stroke="white" stroke-width="0.7" stroke-opacity="0.3"/>
        <text x="248" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" fill="white" opacity="0.5" font-weight="600">GOAL</text>

        <!-- Dashed arrow: A throws ball in from sideline -->
        <line x1="58" y1="160" x2="118" y2="160" stroke="white" stroke-width="1.8" stroke-dasharray="6,4" stroke-opacity="0.9" marker-end="url(#arrowWhite)"/>

        <!-- Curved arrow at B: 180 degree turn -->
        <path d="M 148,135 A 28,28 0 0,1 148,185" fill="none" stroke="#FFD54F" stroke-width="2.2" stroke-opacity="0.95" marker-end="url(#arrowGreen)"/>
        <text x="182" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7.5" fill="#FFD54F" font-weight="600">turn</text>

        <!-- Dashed arrow: B shoots toward goal -->
        <line x1="155" y1="178" x2="232" y2="145" stroke="white" stroke-width="1.8" stroke-dasharray="6,4" stroke-opacity="0.9" marker-end="url(#arrowWhite)"/>
        <text x="205" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" fill="white" opacity="0.6" font-weight="600">SHOT</text>

        <!-- Player A (thrower on sideline) -->
        <circle cx="38" cy="160" r="18" fill="#2196F3" stroke="white" stroke-width="2"/>
        <text x="38" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="white">A</text>

        <!-- Ball near A -->
        <circle cx="58" cy="143" r="6" fill="white" stroke="#333" stroke-width="1.2"/>

        <!-- Player B (receiver, back to goal) -->
        <circle cx="140" cy="160" r="18" fill="#FF9800" stroke="white" stroke-width="2"/>
        <text x="140" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="white">B</text>
        <!-- Back indicator (small arrow showing B faces away from goal) -->
        <text x="140" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" fill="white" opacity="0.7" font-weight="600">back to goal</text>

        <!-- Sideline marker -->
        <text x="18" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="white" opacity="0.5">SIDELINE</text>

        <!-- Caption area -->
        <rect x="12" y="280" width="246" height="48" rx="6" ry="6" fill="#f8f8f8"/>
        <text x="135" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#555" font-weight="500">Trap the ball, turn 180°</text>
        <text x="135" y="314" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#555" font-weight="500">toward goal, and shoot!</text>
      </g>

      <!-- ============================================================ -->
      <!-- Legend at bottom                                              -->
      <!-- ============================================================ -->
      <g transform="translate(10, 368)">
        <circle cx="12" cy="6" r="5" fill="#2196F3" stroke="white" stroke-width="1"/>
        <text x="22" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#666">Player A</text>
        <circle cx="90" cy="6" r="5" fill="#FF9800" stroke="white" stroke-width="1"/>
        <text x="100" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#666">Player B</text>
        <line x1="165" y1="6" x2="195" y2="6" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
        <text x="200" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#666">Ball path</text>
        <line x1="270" y1="6" x2="300" y2="6" stroke="#FFD54F" stroke-width="2"/>
        <text x="305" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#666">Player movement</text>
        <polygon points="390,2 386,10 394,10" fill="#FFD54F" stroke="#F9A825" stroke-width="0.5"/>
        <text x="400" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#666">Cone</text>
        <circle cx="458" cy="6" r="5" fill="white" stroke="#333" stroke-width="1"/>
        <text x="468" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#666">Ball</text>
      </g>
    </svg>
  </div>
</body>
</html>
